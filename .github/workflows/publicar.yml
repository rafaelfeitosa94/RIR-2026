name: Publicar vendas RIR 2026

# Roda nos servidores do GitHub - nao depende de nenhuma maquina ligada.
#
# POR QUE UM LACO, E NAO UM CRON DE 5 MINUTOS
# -------------------------------------------
# O evento 'schedule' do Actions e melhor-esforco: o GitHub atrasa e ate
# descarta execucoes agendadas sob carga. Na pratica um "*/5" roda a cada 15,
# 30 ou 60 minutos - inutil para acompanhar venda ao vivo.
#
# Entao, em vez de 288 execucoes por dia, esta workflow abre UMA execucao que
# fica viva publicando a cada 2 minutos ate perto do limite de 6 horas por job,
# e no fim dispara a proxima. Repositorio publico tem minutos de Actions
# ilimitados, entao isso nao consome cota.

on:
  workflow_dispatch:
  schedule:
    # Rede de seguranca: se a corrente quebrar (job morto, limite atingido),
    # isto reabre o laco. Nao e o mecanismo principal, e o plano B.
    - cron: "*/30 * * * *"

permissions:
  contents: write
  actions: write            # necessario para encadear a proxima execucao

concurrency:
  # Um laco por vez. Uma execucao nova espera a anterior terminar em vez de
  # ser cancelada, senao a rede de seguranca mataria o laco em andamento.
  group: publicar-rir
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 355    # o teto do GitHub e 360

    env:
      # O runner roda em UTC. Sem isto, datetime.now() adianta 3h: o coletor
      # pediria horas futuras e fecharia hora que ainda esta vendendo.
      TZ: America/Sao_Paulo
      ZIG_TOKEN_PARCEIRO: ${{ secrets.ZIG_TOKEN_PARCEIRO }}
      ZIG_CODIGO_EVENTO: ${{ secrets.ZIG_CODIGO_EVENTO }}
      INTERVALO_S: 120       # segundos entre publicacoes
      DURACAO_S: 19800       # 5h30 de laco, com folga ate o teto de 6h

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --quiet requests pandas

      # O .jsonl bruto nao vai para o repositorio (ficaria enorme). Se o cache
      # sumir, a execucao seguinte so recoleta o periodo - fica lenta, nao
      # perde dado.
      - name: Restaurar dados coletados
        uses: actions/cache/restore@v4
        with:
          path: dados_rir2026
          key: dados-rir-${{ github.run_id }}
          restore-keys: dados-rir-

      - name: Publicar em laco
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          fim=$(( $(date +%s) + DURACAO_S ))
          ciclo=0

          while [ "$(date +%s)" -lt "$fim" ]; do
            ciclo=$((ciclo + 1))
            echo "::group::ciclo $ciclo - $(date '+%H:%M:%S')"

            python stream_rir.py --uma-vez --sem-git --reusar-token || true

            git add publico
            if git diff --cached --quiet; then
              echo "nada mudou"
            else
              git commit -q -m "dados RIR26 $(date '+%Y-%m-%d %H:%M:%S')"
              # Outra execucao (ou o PC do BI) pode ter commitado no meio.
              git pull --rebase --autostash -q origin main || true
              git push -q || echo "push falhou - tenta no proximo ciclo"
            fi

            echo "::endgroup::"
            sleep "$INTERVALO_S"
          done

      # Guarda o estado para a proxima execucao nao recomecar do zero.
      - name: Salvar dados coletados
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dados_rir2026
          key: dados-rir-${{ github.run_id }}

      - name: Encadear a proxima execucao
        if: always()
        env:
          # O GITHUB_TOKEN NAO consegue disparar outra workflow (o GitHub
          # bloqueia para evitar recursao). Com um PAT em secrets.PAT_CHAIN a
          # corrente segue sem intervalo; sem ele, o cron de 30 min reabre o
          # laco - com um buraco de ate ~1h a cada 5h30.
          GH_TOKEN: ${{ secrets.PAT_CHAIN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "PAT_CHAIN nao configurado - a proxima execucao virá do cron."
            exit 0
          fi
          gh workflow run publicar.yml --repo "${{ github.repository }}"
          echo "proxima execucao disparada"
