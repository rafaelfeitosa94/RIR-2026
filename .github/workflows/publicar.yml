name: Publicar vendas RIR 2026

# Roda nos servidores do GitHub - nao depende de nenhuma maquina ligada.
# A cada execucao: chama a API da Zig, regenera publico/*.json e commita.
# O GitHub Pages republica sozinho a cada commit.

on:
  schedule:
    # A cada 5 minutos: e o intervalo minimo aceito pelo GitHub. Na pratica o
    # agendador atrasa em horario de pico, entao o intervalo real fica entre
    # 5 e 15 minutos.
    - cron: "*/5 * * * *"
  workflow_dispatch:        # permite rodar na mao pela aba Actions

# Necessario para o passo de commit conseguir escrever no repositorio.
permissions:
  contents: write

concurrency:
  # Duas execucoes ao mesmo tempo brigariam no push. A nova espera a anterior
  # terminar em vez de ser cancelada, para nenhum ciclo de coleta se perder.
  group: publicar-rir
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest

    env:
      # O runner do GitHub roda em UTC. Sem isto, datetime.now() adianta 3h:
      # o coletor pediria horas que ainda nao aconteceram e marcaria como
      # "definitiva" uma hora que ainda esta recebendo venda.
      TZ: America/Sao_Paulo
      # Credenciais da Zig: cadastradas em Settings > Secrets and variables >
      # Actions. Nunca ficam no codigo - credenciais.py le do ambiente.
      ZIG_TOKEN_PARCEIRO: ${{ secrets.ZIG_TOKEN_PARCEIRO }}
      ZIG_CODIGO_EVENTO: ${{ secrets.ZIG_CODIGO_EVENTO }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --quiet requests pandas

      # O .jsonl bruto nao vai para o repositorio (ficaria enorme), entao fica
      # no cache entre execucoes. Se o cache sumir, a execucao seguinte apenas
      # recoleta o periodo inteiro - fica mais lenta, mas nao perde dado.
      - name: Restaurar dados coletados
        uses: actions/cache@v4
        with:
          path: dados_rir2026
          key: dados-rir-${{ github.run_id }}
          restore-keys: dados-rir-

      - name: Coletar e gerar os JSONs
        run: python stream_rir.py --uma-vez --sem-git --reusar-token

      - name: Commitar o que mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publico
          # Sem mudanca nao ha commit: evita encher o historico de commits
          # vazios nas horas em que o evento nao esta vendendo.
          if git diff --cached --quiet; then
            echo "nada mudou nesta execucao"
            exit 0
          fi
          git commit -m "dados RIR26 $(date '+%Y-%m-%d %H:%M:%S')"
          # Outra execucao pode ter commitado enquanto esta rodava.
          git pull --rebase --autostash origin main
          git push
